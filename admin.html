<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель адміністратора — Вхідні повідомлення</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1c1e21;
      margin-bottom: 25px;
    }
    .msg-card {
      background: #ffffff;
      padding: 16px 20px;
      margin-bottom: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      border-left: 5px solid #007bff;
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .msg-author {
      font-weight: bold;
      color: #050505;
      font-size: 1.05em;
    }
    .msg-time {
      font-size: 0.8em;
      color: #65676b;
    }
    .msg-text {
      color: #1c1e21;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .no-messages {
      text-align: center;
      color: #65676b;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📥 Панель повідомлень</h1>
    <div id="messages-list">
      <div class="no-messages">Завантаження повідомлень...</div>
    </div>
  </div>
  </script>
</body>
</html>
