<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід у свій акаунт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <h2>Вхід в акаунт</h2>
        <p class="login-subtitle">Увійдіть, щоб додавати нові проєкти</p>

        <!-- 📍 ОСЬ ЦЕЙ БЛОК ФОРМИ СЛІД ОНОВИТИ: -->
        <form id="login-form">
            <div class="form-group">
                <label for="login-input">Email / Логін</label>
                <!-- Додано id="login-input" -->
                <input type="text" id="login-input" placeholder="Введіть ваш логін" required>
            </div>

            <div class="form-group">
                <label for="password-input">Пароль</label>
                <!-- Додано id="password-input" -->
                <input type="password" id="password-input" placeholder="Введіть пароль" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Увійти</button>
        </form>

        <div class="login-footer">
            <a href="index.html">← Повернутися до профілю</a>
        </div>
    </div>
    <script>
    const loginForm = document.getElementById('login-form');
    const loginInput = document.getElementById('login-input');
    const passwordInput = document.getElementById('password-input');

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Зупиняємо стандартне перезавантаження сторінки

        const username = loginInput.value.trim();
        const password = passwordInput.value.trim();

        // Проста перевірка (можеш змінити логін і пароль на свої)
        if (username === 'admin' && password === '1234') {
            // 1. Зберігаємо прапорець, що ми авторизовані
            localStorage.setItem('isLoggedIn', 'true');
            
            alert('Успішний вхід! Переходимо до профілю.');
            
            // 2. Перенаправляємо на головну сторінку
            window.location.href = 'index.html';
        } else {
            alert('Невірний логін або пароль! Спробуйте admin / 1234');
        }
    });
</script>

</body>
</html>
